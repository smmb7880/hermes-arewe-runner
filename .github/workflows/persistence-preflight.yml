
name: Persistence Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Verify Cloudflare API and D1
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      WORKER_URL: https://hermes-arewe-api.smmb7880.workers.dev
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

    steps:
      - name: Verify configuration and API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const token = process.env.ADMIN_TOKEN;

          if (!base || !token) {
            console.error("Missing WORKER_URL or ADMIN_TOKEN secret.");
            process.exit(1);
          }

          async function request(path, authenticated = false) {
            const headers = {};
            if (authenticated) {
              headers.Authorization = `Bearer ${token}`;
            }

            const response = await fetch(`${base}${path}`, {
              method: "GET",
              headers,
              signal: AbortSignal.timeout(15000)
            });

            if (!response.ok) {
              throw new Error(`${path} returned HTTP ${response.status}`);
            }

            return response.json();
          }

          try {
            const health = await request("/health");

            if (health.status !== "ok" || health.database !== "connected") {
              throw new Error("Worker or D1 health check failed.");
            }

            console.log("PASS: Worker and D1 health");

            const endpoints = [
              "/v1/knowledge",
              "/v1/campaigns",
              "/v1/tasks",
              "/v1/skills",
              "/v1/learning",
              "/v1/logs"
            ];

            for (const endpoint of endpoints) {
              const result = await request(endpoint, true);

              if (!result || !Array.isArray(result.data)) {
                throw new Error(`${endpoint} returned an unexpected response.`);
              }

              console.log(`PASS: ${endpoint}`);
            }

            console.log("SUCCESS: All persistence preflight checks passed.");
          } catch (error) {
            console.error("PREFLIGHT FAILED:", error.message);
            process.exit(1);
          }
          NODE
