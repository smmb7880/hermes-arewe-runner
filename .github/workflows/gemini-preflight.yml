
name: Gemini Free-Tier Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    name: Verify Gemini API
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Test one Gemini generation request
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const apiKey = process.env.GEMINI_API_KEY;
          const model = "gemini-3.5-flash-lite";

          if (!apiKey) {
            console.error("GEMINI_API_KEY secret is missing.");
            process.exit(1);
          }

          const endpoint =
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

          try {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey
              },
              body: JSON.stringify({
                contents: [{
                  parts: [{ text: "Reply exactly: HERMES_GEMINI_PREFLIGHT_OK" }]
                }],
                generationConfig: {
                  temperature: 0,
                  maxOutputTokens: 32
                }
              }),
              signal: AbortSignal.timeout(30000)
            });

            if (!response.ok) {
              console.error(`Gemini request failed: HTTP ${response.status}`);
              process.exit(1);
            }

            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts
              ?.map(part => part.text || "")
              .join("")
              .trim();

            if (!text) {
              console.error("Gemini returned no usable text.");
              process.exit(1);
            }

            console.log("PASS: Gemini API authentication");
            console.log("PASS: Model generation completed");
            console.log(`Model: ${model}`);
            console.log("No fallback model was used.");
          } catch (error) {
            console.error("Gemini test failed:", error.name);
            process.exit(1);
          }
          NODE
